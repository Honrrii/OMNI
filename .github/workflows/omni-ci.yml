name: OMNI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-python-tests:
    name: Backend Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install and authorize Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            apparmor-profiles \
            apparmor-utils

          echo "Bubblewrap path:"
          command -v bwrap

          echo "Bubblewrap version:"
          bwrap --version

          echo "AppArmor user namespace setting:"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true

          PROFILE="/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"

          if [ ! -f "$PROFILE" ]; then
            echo "Required Bubblewrap AppArmor profile not found:"
            echo "$PROFILE"
            exit 1
          fi

          sudo install -m 0644 \
            "$PROFILE" \
            /etc/apparmor.d/bwrap-userns-restrict

          sudo apparmor_parser -r \
            /etc/apparmor.d/bwrap-userns-restrict

          echo "Bubblewrap AppArmor profile loaded."

      - name: Verify Bubblewrap isolation
        run: |
          bwrap \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            --unshare-user \
            --unshare-pid \
            --unshare-ipc \
            --unshare-net \
            /bin/true

          echo "Bubblewrap namespace isolation verified."

      - name: Create trusted CI virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/omni-ci-venv"
          "$RUNNER_TEMP/omni-ci-venv/bin/python" -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          # Do not install root requirements.txt here. That file can contain
          # local ROS 2/system packages from a developer machine, such as
          # ackermann-msgs and rclpy, which are not installable from PyPI on
          # GitHub-hosted runners.
          #
          # OMNI CI installs only the Python packages required by the curated
          # tests/ suite.
          "$RUNNER_TEMP/omni-ci-venv/bin/python" -m pip install \
            pytest \
            fastapi \
            uvicorn \
            pydantic \
            python-dotenv \
            openai \
            google-generativeai \
            numpy \
            PyYAML \
            requests \
            httpx \
            Pillow \
            matplotlib \
            Jinja2 \
            python-dateutil \
            ezdxf

      - name: Install CPU PyTorch for OMNITorch
        run: |
          "$RUNNER_TEMP/omni-ci-venv/bin/python" -m pip install \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Verify trusted runtime and Git fixtures
        run: |
          "$RUNNER_TEMP/omni-ci-venv/bin/python" - <<'PY'
          import sys
          from pathlib import Path
          import torch
          import torchvision

          print("Python executable:", sys.executable)
          print("Virtualenv prefix:", sys.prefix)
          print("Base prefix:", sys.base_prefix)
          print("PyTorch version:", torch.__version__)
          print("Torchvision version:", torchvision.__version__)
          print("CUDA available:", torch.cuda.is_available())

          assert sys.prefix != sys.base_prefix, \
              "CI Python is not running inside a virtualenv"

          assert Path(sys.executable).exists(), \
              "CI Python executable does not exist"
          PY

          git rev-parse refs/tags/testcube-v1

      # Collection scope is the curated tests/ suite only.
      # pytest.ini defines testpaths and norecursedirs.
      #
      # PYTEST_DISABLE_PLUGIN_AUTOLOAD prevents globally installed plugins,
      # including ROS 2 pytest plugins, from interfering with collection.
      #
      # A pytest exit code of 5 (no tests collected) remains a failure.
      - name: Run Python tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          "$RUNNER_TEMP/omni-ci-venv/bin/python" -m pytest tests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build